name: PRRadar

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Config.xcconfig
  Release: Config/Config.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  PRRadar:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).prradar
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: PR Radar
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [prradar]
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [prradar.refresh]
        GitHubClientID: $(GITHUB_CLIENT_ID)
        GitHubAppSlug: $(GITHUB_APP_SLUG)
        AppGroupIdentifier: group.$(BUNDLE_ID_PREFIX).prradar
    entitlements:
      path: App/PRRadar.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).prradar
    dependencies:
      - target: PRRadarWidget

  PRRadarWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
      - Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).prradar.widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: PR Radar
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        GitHubClientID: $(GITHUB_CLIENT_ID)
        GitHubAppSlug: $(GITHUB_APP_SLUG)
        AppGroupIdentifier: group.$(BUNDLE_ID_PREFIX).prradar
    entitlements:
      path: Widget/PRRadarWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(BUNDLE_ID_PREFIX).prradar
